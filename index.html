<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حملة الحمادي — تطبيق الحاج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F6; --card:#FFFFFF; --ink:#1B0D13; --ink2:#5B4951; --mute:#8D7D84;
  --brand:#7C1D3F; --brand-d:#5E1430; --brand-l:#F7EBEF; --brand-b:#EDD6DE;
  --gold:#B48A3C; --gold-l:#FBF3E3; --line:#EBE7E8;
  --ok:#2E7D5B; --ok-l:#E8F3EE; --warn:#B07A10; --bad:#B32B33; --bad-l:#FBECEC;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:#DCD4D7;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:16px 10px;font-variant-numeric:tabular-nums}
.stage{width:100%;max-width:430px}
.note{text-align:center;font-size:12px;color:#7D7276;margin:0 0 10px}
.app{position:relative;height:min(848px,calc(100dvh - 76px));border-radius:26px;overflow:hidden;
  background:var(--bg);border:1px solid #CDC4C8;display:flex;flex-direction:column;
  box-shadow:0 30px 60px -30px rgba(27,13,19,.45)}
/* header */
.hd{background:var(--brand);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:12px;flex:none;
  position:relative;overflow:hidden}
.hd::after{content:'';position:absolute;width:190px;height:190px;border-radius:50%;
  border:26px solid rgba(255,255,255,.055);top:-105px;left:-55px}
.hd img{width:40px;height:40px;flex:none;position:relative}
.hd .tx{flex:1;position:relative}
.hd .k{font-size:11px;opacity:.78;letter-spacing:.05em}
.hd .n{font-size:17px;font-weight:600;margin-top:1px}
.hbtn{background:rgba(255,255,255,.14);border:0;width:38px;height:38px;border-radius:12px;cursor:pointer;
  display:grid;place-items:center;position:relative;flex:none}
.hbtn svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hbtn.av{background:#fff;color:var(--brand);font-family:inherit;font-weight:700;font-size:16px}
.hbtn.sos{background:#fff}
.hbtn.sos svg{stroke:var(--brand)}
.hbtn .dot{position:absolute;top:7px;inset-inline-end:7px;width:8px;height:8px;border-radius:50%;
  background:#FFC24A;border:1.5px solid var(--brand)}
.sc{flex:1;overflow-y:auto;padding:14px 14px 22px}
.sc::-webkit-scrollbar{width:0}
/* cards */
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:11px}
.c.flat{padding:4px 16px}
.hero{background:linear-gradient(162deg,var(--brand) 0%,var(--brand-d) 100%);color:#fff;
  border-radius:18px;padding:19px;margin-bottom:11px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;width:210px;height:210px;border-radius:50%;
  border:26px solid rgba(255,255,255,.05);top:-86px;left:-56px}
.hero>*{position:relative}
.lb{font-size:12px;color:var(--mute);letter-spacing:.03em;margin:0 0 6px}
.hero .lb{color:rgba(255,255,255,.72)}
.vl{font-size:33px;font-weight:700;line-height:1.12;letter-spacing:-.02em}
.vs{font-size:14px;margin-top:6px;line-height:1.65;color:var(--ink2)}
.hero .vs{color:rgba(255,255,255,.85)}
.rw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:8px;background:var(--brand-l);color:var(--brand)}
.tag.a{background:var(--gold-l);color:#7E5E14}
.tag.r{background:var(--bad-l);color:var(--bad)}
.tag.g{background:var(--ok-l);color:var(--ok)}
.tag.w{background:rgba(255,255,255,.17);color:#fff}
.ring{display:flex;align-items:center;gap:15px}
.ring svg{width:74px;height:74px;flex:none;transform:rotate(-90deg)}
.ring .t{font-size:15.5px;font-weight:600}
.ring .d{font-size:12.5px;color:var(--mute);margin-top:4px}
.prof{background:linear-gradient(162deg,var(--brand) 0%,var(--brand-d) 100%);color:#fff;border-radius:18px;
  padding:20px;text-align:center;position:relative;overflow:hidden;margin-bottom:11px}
.prof::after{content:'';position:absolute;width:210px;height:210px;border-radius:50%;
  border:26px solid rgba(255,255,255,.05);top:-90px;left:-56px}
.prof>*{position:relative}
.prof .pic{width:74px;height:74px;border-radius:50%;background:#fff;color:var(--brand);
  display:grid;place-items:center;font-size:28px;font-weight:700;margin:0 auto 10px}
.prof .nm{font-size:19px;font-weight:700}
.prof .sb2{font-size:13px;color:rgba(255,255,255,.76);margin-top:4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv .k2{font-size:13.5px;color:var(--mute)}
.kv .v2{font-size:14.5px;font-weight:600;text-align:end}
.sw{width:44px;height:26px;border-radius:99px;background:#DFD9DB;position:relative;flex:none;cursor:pointer;
  transition:.2s}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}
.sw.on::after{inset-inline-start:21px}
.spir{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.sp{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;font-family:inherit;font-size:11.5px;
  font-weight:600;color:var(--ink)}
.sp:active{background:var(--brand-l);border-color:var(--brand-b)}
.sp svg{width:23px;height:23px;stroke:var(--brand);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sp.g svg{stroke:var(--gold)}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.dh{font-size:18px;line-height:2.1;text-align:center;padding:4px 2px}
.dh .cnt{display:inline-block;background:var(--brand-l);color:var(--brand);font-size:12.5px;
  font-weight:700;padding:3px 10px;border-radius:999px;margin-inline-start:8px;vertical-align:middle}
.pstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px;position:relative}
.pr{text-align:center;padding:9px 2px;border-radius:11px;background:rgba(255,255,255,.08)}
.pr.past{opacity:.45}
.pr.now{background:#fff;color:var(--brand)}
.pr .nm{font-size:11.5px;font-weight:600}
.pr .tmv{font-size:14px;font-weight:700;margin-top:3px;letter-spacing:-.01em}
.lead{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:11px;
  border-inline-start:4px solid var(--brand)}
.lead .who{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.lead .who .av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;
  place-items:center;font-size:12px;font-weight:700;flex:none}
.lead .who .nm{font-size:13.5px;font-weight:600}
.lead .who .tm{margin-inline-start:auto;font-size:11.5px;color:var(--mute)}
.lead .tx{font-size:16.5px;font-weight:600;line-height:1.6}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.mn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;
  text-align:start}
.mn .k{font-size:11.5px;color:var(--mute)}
.mn .t{font-size:14.5px;font-weight:600;margin-top:5px;line-height:1.45}
.mn.hot{border-color:var(--brand-b);background:var(--brand-l)}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:11px}
.qa{padding:11px 3px!important}
.qa{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 5px;
  display:flex;flex-direction:column;align-items:center;gap:7px;font-family:inherit;font-size:11.5px;
  font-weight:600;color:var(--ink);cursor:pointer}
.qa:active{background:var(--brand-l)}
.qa svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qa.r svg{stroke:var(--bad)}.qa.r{color:var(--bad)}
.it{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
.it .t{font-size:15.5px;font-weight:600}
.it .d{font-size:12.5px;color:var(--mute);margin-top:3px}
.it .go{margin-inline-start:auto;font-size:13px;color:var(--mute);font-weight:600;flex:none}
.ic{width:36px;height:36px;border-radius:11px;background:var(--brand-l);display:grid;place-items:center;flex:none}
.ic svg{width:19px;height:19px;stroke:var(--brand);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.a{background:var(--gold-l)}.ic.a svg{stroke:#7E5E14}
.ic.r{background:var(--bad-l)}.ic.r svg{stroke:var(--bad)}
.ic.g{background:var(--ok-l)}.ic.g svg{stroke:var(--ok)}
.ic.n{background:#F2F0F1}.ic.n svg{stroke:#A79BA0}
.tl{position:relative;padding-inline-start:26px}
.tl::before{content:'';position:absolute;inset-inline-start:7px;top:12px;bottom:12px;width:2px;background:var(--line)}
.tl .n{position:relative;padding:12px 0}
.tl .n::before{content:'';position:absolute;inset-inline-start:-24px;top:17px;width:12px;height:12px;
  border-radius:50%;background:#fff;border:2.5px solid #D6CDD1}
.tl .n.done::before{background:var(--ok);border-color:var(--ok)}
.tl .n.now::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px #B48A3C28}
.tl .t{font-size:15.5px;font-weight:600}
.tl .d{font-size:12.5px;color:var(--mute);margin-top:3px}
.pass{background:linear-gradient(160deg,var(--brand) 0%,#3F0C21 100%);color:#fff;border-radius:18px;
  padding:20px;text-align:center;position:relative;overflow:hidden}
.pass img{width:44px;height:44px;opacity:.95}
.pass .nm{font-size:19px;font-weight:700;margin-top:8px}
.pass .mt{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:4px;letter-spacing:.04em}
.qr{width:158px;height:158px;background:#fff;border-radius:12px;padding:11px;margin:15px auto 8px}
.qr svg{width:100%;height:100%}
.ayah{line-height:2.35;text-align:center;font-size:21px}
.ayah b{color:var(--brand);font-size:.62em;font-weight:700}
/* video */
.vcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:11px}
.thumb{height:132px;position:relative;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--brand),#3F0C21)}
.thumb.g{background:linear-gradient(145deg,#2E7D5B,#174433)}
.thumb.o{background:linear-gradient(145deg,#B48A3C,#6E5219)}
.thumb::before{content:'';position:absolute;inset:0;opacity:.3;
  background:radial-gradient(circle at 70% 20%, #ffffff33, transparent 55%)}
.play{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.93);display:grid;
  place-items:center;position:relative;box-shadow:0 8px 20px -8px #000}
.play::after{content:'';border-style:solid;border-width:9px 14px 9px 0;
  border-color:transparent var(--brand) transparent transparent;margin-inline-end:4px}
.dur{position:absolute;bottom:9px;inset-inline-end:9px;background:rgba(0,0,0,.6);color:#fff;
  font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px}
.vmeta{padding:13px 14px}
.vmeta .t{font-size:15.5px;font-weight:600}
.vmeta .d{font-size:12.5px;color:var(--mute);margin-top:4px}
.chipsrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chipsrow::-webkit-scrollbar{height:0}
.chip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:9px 15px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* chat */
.chat{display:flex;flex-direction:column;gap:9px;padding:4px 0 10px}
.msg{max-width:78%;padding:11px 13px;border-radius:15px;font-size:14.5px;line-height:1.6;position:relative}
.msg .who{font-size:11.5px;font-weight:700;color:var(--brand);margin-bottom:3px}
.msg .tm{font-size:10.5px;color:var(--mute);margin-top:5px}
.msg.them{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-start-start-radius:5px}
.msg.me{background:var(--brand);color:#fff;align-self:flex-end;border-start-end-radius:5px}
.msg.me .tm{color:rgba(255,255,255,.7)}
.msg.pin{background:var(--gold-l);border:1px solid #EBDCBB;align-self:stretch;max-width:none}
.msg.pin .who{color:#7E5E14}
.cbar{display:flex;gap:8px;align-items:center;padding-top:8px;border-top:1px solid var(--line);margin-top:6px}
.cbar input{flex:1;font-family:inherit;font-size:15px;padding:13px 14px;border:1px solid var(--line);
  border-radius:13px;background:var(--card);color:var(--ink)}
.cbar input:focus{outline:2px solid var(--brand-b);border-color:var(--brand)}
.cbar button{background:var(--brand);border:0;width:46px;height:46px;border-radius:13px;cursor:pointer;
  display:grid;place-items:center;flex:none}
.cbar button svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* quiz */
.q{font-size:20px;font-weight:600;line-height:1.6;margin:6px 0 16px}
.op{width:100%;display:flex;align-items:center;gap:12px;text-align:start;font-family:inherit;font-size:16px;
  font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;
  margin-bottom:9px;cursor:pointer;color:var(--ink)}
.op span{width:26px;height:26px;border-radius:8px;background:#F2F0F1;display:grid;place-items:center;
  font-size:13px;color:var(--mute);flex:none}
.op.ok{background:var(--ok-l);border-color:var(--ok)}.op.ok span{background:var(--ok);color:#fff}
.op.no{background:var(--bad-l);border-color:#EEC9C9}.op.no span{background:var(--bad);color:#fff}
.tmr{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.tmr i{display:block;height:100%;background:var(--gold)}
.rk{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rk .p{width:26px;height:26px;border-radius:8px;background:#F2F0F1;display:grid;place-items:center;
  font-weight:700;font-size:13px;flex:none;color:var(--mute)}
.rk .p.one{background:var(--gold);color:#fff}
.rk .s{margin-inline-start:auto;font-weight:700;color:var(--brand)}
.rk.me{background:var(--brand-l);border-radius:10px;padding-inline:10px;border-bottom:0}
/* nav */
.nv{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);
  border-top:1px solid var(--line);padding:7px 2px calc(7px + env(safe-area-inset-bottom,0px))}
.nv button{background:none;border:0;font-family:inherit;font-size:11px;font-weight:600;color:#A79BA0;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 1px;cursor:pointer;position:relative}
.nv svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv button.on{color:var(--brand)}
.nv button.on::before{content:'';position:absolute;top:-8px;width:22px;height:3px;border-radius:99px;background:var(--brand)}
.bdg{position:absolute;top:1px;inset-inline-start:12px;background:var(--bad);color:#fff;font-size:9.5px;
  font-weight:700;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.bk{background:none;border:0;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--brand);
  padding:2px 0 12px;cursor:pointer}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:16px 3px 9px}
.sh h3{margin:0;font-size:13.5px;font-weight:700;color:var(--ink2)}
.sh em{font-style:normal;font-size:12px;color:var(--mute)}
.ts{position:absolute;inset:auto 16px 88px 16px;background:var(--ink);color:#fff;padding:14px;
  border-radius:13px;font-weight:600;font-size:14.5px;text-align:center;opacity:0;transform:translateY(8px);
  transition:.2s;pointer-events:none;z-index:9}
.ts.on{opacity:1;transform:none}
.mt{font-size:11.5px;color:var(--mute);text-align:center;margin-top:11px}
.btn{width:100%;background:var(--brand);color:#fff;border:0;font-family:inherit;font-weight:600;
  font-size:15.5px;padding:15px;border-radius:14px;cursor:pointer}
.btn.g{background:#F2F0F1;color:var(--ink)}
.btn.o{background:var(--gold)}
</style>
</head>
<body>
<div class="stage">
  <p class="note">حملة الحمادي · نموذج تفاعلي</p>
  <div class="app">
    <div class="hd">
      <img id="lg" alt="">
      <div class="tx"><div class="k">حملة الحمادي · موسم ١٤٤٧</div><div class="n">عبدالله الكواري</div></div>
      <button class="hbtn av" onclick="go('me')" title="حسابي">ع</button>
      <button class="hbtn" onclick="go('inbox')" title="الإشعارات">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/></svg><span class="dot"></span></button>
      <button class="hbtn sos" onclick="go('emg')" title="نجدة">
        <svg viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg></button>
    </div>
    <div class="sc" id="sc"></div>
    <div class="ts" id="ts"></div>
    <nav class="nv">
      <button class="on" data-t="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>الرئيسية</button>
      <button data-t="trip" onclick="go('trip')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M3 11h18M7 21v-2M17 21v-2"/></svg>رحلتي</button>
      <button data-t="guide" onclick="go('guide')"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M9 8h6M9 12h6"/></svg>العبادة</button>
      <button data-t="act" onclick="go('act')"><svg viewBox="0 0 24 24"><path d="M12 3 14.5 9 21 9.5l-5 4.2 1.6 6.3L12 16.7 6.4 20l1.6-6.3-5-4.2L9.5 9z"/></svg>الأنشطة<span class="bdg">!</span></button>
      <button data-t="me" onclick="go('me')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>الملف</button>
    </nav>
  </div>

const mg=m=>`<div class="msg ${m.k}">${m.w?`<div class="who">${m.w}</div>`:''}${m.t}<div class="tm">${m.m}</div></div>`;
let cur='home',par='home';
const bk=()=>`<button class="bk" onclick="go('${par}')">› رجوع</button>`;
const TAB={home:1,trip:1,guide:1,act:1,me:1};
function go(k){
  if(TAB[k])par=k;else if(TAB[cur])par=cur;
  cur=k;const sc=document.getElementById('sc');
  sc.innerHTML=V[k]().replace(/LOGOW/g,LOGO_W);sc.scrollTop=0;
  document.querySelectorAll('.nv button').forEach(b=>b.classList.toggle('on',b.dataset.t===par));
  tick();
  if(k==='chat'){const c=document.getElementById('ch');if(c)c.scrollIntoView({block:'end'})}
  if(k==='quiz'){const t=document.getElementById('qt');let w=100;clearInterval(window._q);
    window._q=setInterval(()=>{w-=1.1;t.style.width=Math.max(0,w)+'%';if(w<=0)clearInterval(window._q)},130)}
}
function oc(k){openChat=k;par='trip';go('chat')}
function snd(){const i=document.getElementById('ci');if(!i||!i.value.trim())return;
  const now=new Date();const h=now.getHours()%12||12;
  CHATS[openChat].msgs.push({w:'',t:i.value.trim(),m:`${ar(h)}:${ar(String(now.getMinutes()).padStart(2,'0'))} ${now.getHours()<12?'ص':'م'}`,k:'me'});
  i.value='';go('chat');const c=document.getElementById('ch');if(c)c.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'})}
function sw(el){const k=el.querySelector('.sw');if(!k)return;k.classList.toggle('on');
  toast(k.classList.contains('on')?'فُعّل':'أُوقف')}
function rate(n){document.querySelectorAll('#st span').forEach(s=>{
  s.style.color=(+s.dataset.i<=n)?'#B48A3C':'#D9CDB0'});toast('شكراً لتقييمك '+ar(n)+' من ٥')}
function cnt(b){b._n=(b._n||0)+1;b.textContent='عددت '+ar(b._n)+' من ١٠٠';
  if(b._n>=100){b.textContent='✓ أتممت المئة';b.style.background='#2E7D5B';b.style.color='#fff'}}
function tick2(el){el.querySelector('.ic').className='ic g';el.querySelector('.go').textContent='✓';
  el.querySelector('.go').style.color='#2E7D5B';el.onclick=null;toast('تم التحديد')}
function vf(el,k){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');toast('عُرضت: '+el.textContent)}
function toast(m){const t=document.getElementById('ts');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2300)}
function sos(){toast('أُرسل بلاغك لقائد الباص وإدارة الحملة')}
function here(){const b=document.getElementById('hb');if(!b)return;
  b.textContent='✓ سُجّل حضورك — القائد يراك الآن';b.style.background='#2E7D5B';b.onclick=null;
  toast('سُجّل حضورك عند نقطة التجمع')}
function fz(d){const a=document.getElementById('ay');
  if(a){a.style.fontSize=(parseFloat(getComputedStyle(a).fontSize)+d)+'px';return}
  toast(d>0?'كُبّر حجم النص':'صُغّر حجم النص')}
function spin(){const n=document.getElementById('nd');if(!n)return;
  n.style.transform='rotate(-22deg)';setTimeout(()=>n.style.transform='rotate(7deg)',420);
  setTimeout(()=>n.style.transform='rotate(0deg)',840);toast('تمت المعايرة')}
function ans(el,ok){document.querySelectorAll('.op').forEach(o=>o.onclick=null);
  el.classList.add(ok?'ok':'no');
  if(!ok)document.querySelectorAll('.op')[2].classList.add('ok');
  clearInterval(window._q);
  if(ok){document.getElementById('sc3').textContent=ar(860);toast('إجابة صحيحة · ٩٥ نقطة — المركز ٢')}
  else toast('الإجابة الصحيحة: سبعة أشواط')}
go('home');
</script>
